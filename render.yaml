services:
  - type: web
    name: procureproof
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: procureproof-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_PATH
        value: /var/data/procureproof.db
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WORKSPACE_NAME
        value: My procurement workspace
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: AUTH_OWNER_GITHUB_LOGINS
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_INTAKE_MODEL
        sync: false
